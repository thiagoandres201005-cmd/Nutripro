<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <title>SomaAi</title>
  <link rel="stylesheet" href="./core.css">
  <style>
    #debug { position:fixed;top:0;left:0;right:0;background:#ff0044;color:#fff;padding:12px;font-size:11px;z-index:9999;font-family:monospace;max-height:50vh;overflow:auto;display:none; }
    #debug.show { display:block; }
  </style>
</head>
<body>
  <div id="app-root"><div style="padding:40px;text-align:center;color:#fff;font-family:monospace">Cargando SomaAi...</div></div>
  <div id="debug"></div>
  <script>
    window.onerror = function(msg, url, line, col, error) {
      var d = document.getElementById('debug');
      d.classList.add('show');
      d.innerHTML += '<div><strong>ERROR:</strong> ' + msg + '<br>URL: ' + url + '<br>Línea: ' + line + ':' + col + '</div><hr style="border-color:#fff;opacity:.3">';
    };
    window.addEventListener('unhandledrejection', function(e) {
      var d = document.getElementById('debug');
      d.classList.add('show');
      d.innerHTML += '<div><strong>PROMISE REJECTED:</strong> ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</div><hr style="border-color:#fff;opacity:.3">';
    });
  </script>
  <script type="module" src="./core.js"></script>
  <script type="module" src="./onboarding.js"></script>
  <script type="module" src="./search.js"></script>
  <script type="module" src="./profile.js"></script>
  <script type="module" src="./camera.js"></script>
</body>
</html>
